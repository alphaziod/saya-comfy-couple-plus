name: Saya Studio release

on:
  push:
    tags: ['studio-v*']
  # Build and test every package on pull requests touching the app; the release job is skipped.
  pull_request:
    paths: ['studio/**', '.github/workflows/studio-release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag for the draft release'
        required: true
        default: 'studio-v1.0.0-beta.1'

permissions:
  contents: read

env:
  VERSION: 1.0.0-beta.1

jobs:
  # (a) Debian/Ubuntu deb, Fedora rpm, AppImage. Built on ubuntu-22.04 so the glibc / WebKitGTK
  # baseline is Debian 12 / Ubuntu 22.04.
  bundles:
    name: deb, Fedora rpm, AppImage
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libssl-dev libayatana-appindicator3-dev patchelf rpm xdg-utils file desktop-file-utils
      - run: npm ci
      - run: cargo test -p studio-core --locked
      - run: node --test scripts/*.test.mjs
      - name: Maintenance binary (shipped as /usr/bin/saya-studio-maintenance)
        run: cargo build --release -p studio-core --bin studio-maintenance --locked
      - name: Bundle
        run: npx tauri build --bundles deb,rpm,appimage --config "{\"version\":\"${VERSION}\"}"
      - name: Name the artifacts
        run: |
          mkdir -p ../dist-release
          b=target/release/bundle
          cp "$(ls $b/deb/*.deb)" "../dist-release/saya-studio_${VERSION}_amd64.deb"
          cp "$(ls $b/rpm/*.rpm)" "../dist-release/saya-studio-${VERSION}.fedora.x86_64.rpm"
          cp "$(ls $b/appimage/*.AppImage)" "../dist-release/saya-studio_${VERSION}_amd64.AppImage"
          ls -l ../dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: dist-release/*
          if-no-files-found: error

  # (b) openSUSE rpm: same build, only the dependency names differ.
  opensuse-rpm:
    name: openSUSE rpm
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libssl-dev libayatana-appindicator3-dev patchelf rpm xdg-utils file
      - run: npm ci
      - run: cargo build --release -p studio-core --bin studio-maintenance --locked
      - name: Bundle rpm with openSUSE dependency names
        run: |
          npx tauri build --bundles rpm \
            --config "{\"version\":\"${VERSION}\"}" \
            --config packaging/rpm/tauri.opensuse.conf.json
      - name: Name the artifact
        run: |
          mkdir -p ../dist-release
          cp "$(ls target/release/bundle/rpm/*.rpm)" "../dist-release/saya-studio-${VERSION}.opensuse.x86_64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: opensuse-rpm
          path: dist-release/*
          if-no-files-found: error

  # (c) Arch: PKGBUILD built by makepkg as a non-root user.
  arch:
    name: Arch package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust nodejs npm webkit2gtk-4.1 gtk3 libsoup3 \
            gdk-pixbuf2 cairo dbus wayland python curl xdg-utils xdg-desktop-portal desktop-file-utils zstd
          useradd -m builder
      - uses: actions/checkout@v4
      - name: Prepare the source tarball and prefetch dependencies
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          su builder -c '
            set -euo pipefail
            cd "$GITHUB_WORKSPACE/studio"
            # PKGBUILD builds with --offline: fill the npm and cargo caches first.
            npm ci --no-audit --no-fund && rm -rf node_modules
            cargo fetch --locked
            stage="$GITHUB_WORKSPACE/arch-stage"
            mkdir -p "$stage"
            tarname="saya-studio-1.0.0beta1.tar.gz"
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git archive --format=tar --prefix=saya-studio/ HEAD . | gzip -n > "$stage/$tarname"
            cp packaging/arch/PKGBUILD packaging/arch/saya-studio.desktop packaging/arch/saya-studio.install "$stage/"
            cp docs/INSTALLATION-ARCH.md docs/SAUVEGARDES.md "$stage/"
            cd "$stage"
            makepkg --geninteg >> PKGBUILD
            PKGEXT=.pkg.tar.zst CARGO_TARGET_DIR="$stage/target" makepkg --noconfirm --nodeps
          '
      - name: Verify the package layout
        working-directory: studio
        run: |
          pkg="$(ls ../arch-stage/*.pkg.tar.zst)"
          python3 scripts/verify-arch-package.py "$pkg" --pkgbuild ../arch-stage/PKGBUILD
      - name: Name the artifact
        run: |
          mkdir -p dist-release
          cp arch-stage/*.pkg.tar.zst "dist-release/saya-studio-${VERSION}-x86_64.pkg.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist-release/*
          if-no-files-found: error

  # (d) Nix. Fails until the hashes in packaging/nix/package.nix are filled in.
  nix:
    name: Nix build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - run: nix build ./studio#default --print-build-logs
      - run: |
          mkdir -p dist-release
          tar --dereference -czf "dist-release/saya-studio-${VERSION}-nix-x86_64-linux.tar.gz" -C result .
      - uses: actions/upload-artifact@v4
        with:
          name: nix
          path: dist-release/*

  # (e) Flatpak. The manifest needs network during the build (see the manifest header).
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: saya-studio.flatpak
          manifest-path: studio/packaging/flatpak/studio.saya.desktop.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - run: |
          mkdir -p dist-release
          cp saya-studio.flatpak "dist-release/saya-studio-${VERSION}-x86_64.flatpak"
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist-release/*

  # (f) Snap.
  snap:
    name: Snap
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Place snapcraft.yaml where snapcraft expects it
        run: |
          mkdir -p studio/snap
          cp studio/packaging/snap/snapcraft.yaml studio/snap/snapcraft.yaml
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: studio
      - run: |
          mkdir -p dist-release
          cp "${{ steps.build.outputs.snap }}" "dist-release/saya-studio_${VERSION}_amd64.snap"
      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: dist-release/*

  release:
    name: Draft prerelease
    needs: [bundles, opensuse-rpm, arch, nix, flatpak, snap]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.bundles.result == 'success' && needs.opensuse-rpm.result == 'success' && needs.arch.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: |
          ls -l
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          Saya Studio 1.0.0-beta.1 (Linux beta).

          Packages: Debian/Ubuntu (.deb), Fedora and openSUSE (.rpm), Arch (.pkg.tar.zst), AppImage, and, when they built, Nix, Flatpak and Snap. Verify downloads against SHA256SUMS.

          This is a beta. ComfyUI and its models are not included. See studio/docs/PACKAGING.md for per-format notes and known limits.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Saya Studio 1.0.0-beta.1 (Linux beta)
          body_path: notes.md
          draft: true
          prerelease: true
          files: assets/*
